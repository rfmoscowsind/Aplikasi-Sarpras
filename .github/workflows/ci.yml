name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, xml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preserve composer lock
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
          retention-days: 1

      - name: PHP syntax check
        run: find app bootstrap config database routes tests -name '*.php' -type f -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: php artisan test
